/* V2.53 全局精细视觉版：只做 CSS 美化，不改 JS / DataLayer / 业务逻辑
   方向：苹方字体 + 克制配色 + 去重阴影 + 收紧留白 + 清晰文字层级 */
:root{
  --blue:#4f6fdf;
  --red:#f05a5a;
  --orange:#ff8a00;
  --green:#14a66b;
  --text:#252b36;
  --muted:#8a8f9e;
  --line:#edf0f5;
  --bg:#f4f6f9;
  --card:#fff;
  --soft:#f7f8fb;
  --shadow:none;
  --radius:12px;
  --radius-sm:8px;
  --num-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
}
*{
  -webkit-tap-highlight-color:transparent;
}
html,body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",Arial,sans-serif;
  font-size:16px;
  line-height:1.34;
  letter-spacing:0;
  color:var(--text);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body{font-weight:400}
button,input,select,textarea{
  font:inherit;
  color:var(--text);
}
button{font-weight:500;cursor:pointer}
.app,.page,.pa-screen,.pe-body,.option-body,.matrix-wrap{background:var(--bg)}

/* 数字与金额：更接近原生进销存软件的整齐感 */
.price,
.metric .num,
.checkout-line b,
.checkout-line strong,
.order-main b,
.pm-summary-num,
.pm-value-num,
.picker-price,
.picker-row .price,
.picker-stock,
.picker-q,
.picker-total b,
.cart-review-price,
.cart-review-num,
.cart-review-amount,
.ba-stat-card .big,
.pay-success-lines .v,
.pay-success-title,
.pay-success-lines,
.pa-value{
  font-family:var(--num-font);
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1,"lnum" 1;
  letter-spacing:-.35px;
}

/* 顶部、底部基础 */
.topbar,
.pa-topbar,
.pe-topbar,
.picker-topbar{
  background:#fff;
  border-bottom:1px solid var(--line);
  box-shadow:none;
}
.topbar{height:58px}
.topbar .left,.topbar .right{height:58px}
.topbar .title,
.pa-topbar .title,
.pe-topbar .title,
.picker-topbar .title{
  margin:0;
  color:var(--text);
  font-size:19px !important;
  font-weight:600 !important;
  letter-spacing:.01em;
}
.icon-btn{
  min-width:36px;
  height:36px;
  border-radius:9px;
  font-size:24px;
  font-weight:400;
  color:#687284;
}
.nav{
  background:rgba(255,255,255,.98);
  border-top:1px solid #dfe4ec;
  box-shadow:none;
}
.nav-inner{height:70px}
.nav-item{
  gap:3px;
  color:#9aa2af;
  font-size:13px;
  font-weight:500;
}
.nav-item.active{color:#1887f2;font-weight:600}
.nav-item .ico{font-size:25px;line-height:1}

/* 表单、按钮 */
input,select,textarea{
  min-height:44px;
  border:1px solid #e1e6ef;
  border-radius:8px;
  background:#fff;
}
input::placeholder,textarea::placeholder,.toolbar .search input::placeholder{color:#a6adba}
input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:#b8c9fb;
  box-shadow:0 0 0 3px rgba(79,111,223,.10);
}
.btn{
  height:50px;
  border-radius:8px;
  padding:0 16px;
  font-size:17px;
  font-weight:650;
  letter-spacing:0;

<script>
/*
  八方来财销售开单版 V2.53
  清理稳定版原则：
  1. 只保留一个核心数据层 DataLayer
  2. 页面不得绕过 DataLayer 自己乱算
  3. 每个页面只保留一个 render 入口
  4. 销售单 qty 为正数，退货 qty 为负数；不再单独切换销售/退货模式
*/
const VERSION = "V2.53";
const STORAGE_KEY = "bafang_sales_v1";
const $ = id => document.getElementById(id);
const n = v => Number(v || 0) || 0;
const money = v => String(Math.round(n(v)));
const numInputValue = v => n(v) === 0 ? "" : String(n(v));
const pct = v => String(Math.round(n(v))) + "%";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function today(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fullDay(ts){
  let t = n(ts);
  if(t > 0 && t < 1000000000000) t *= 1000;
  if(!t) t = Date.now();
  const d = new Date(t);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function timeText(ts){
  const d = new Date(n(ts) || Date.now());
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");
}
function shiftDay(day, delta){
  const d = new Date(String(day || today())+"T00:00:00");
  d.setDate(d.getDate() + delta);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function md(day){ return String(day || "").slice(5).replace("-", "."); }
function uid(prefix="id"){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function placeholderImg(code, name){
  const bg = code === "6027" ? "#f2e6ff" : code === "26031" ? "#dcecff" : "#e8f2ff";
  const txt = String(code || name || "货品").slice(0,5);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><rect width="160" height="160" rx="18" fill="${bg}"/><text x="80" y="75" text-anchor="middle" font-size="24" fill="#334155">${txt}</text><text x="80" y="105" text-anchor="middle" font-size="12" fill="#64748b">${String(name || "").slice(0,8)}</text></svg>`;
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}

const DataLayer = {
  defaultData(){
    const products = [
      this.makeProduct("26195","美人鱼尾巴泳衣","泳衣",69,49,["紫色"],["100","110","120","130","140","150"]),
      this.makeProduct("6027","爱莎亮片连衣裙","连衣裙",69,39,["绿色"],["100","110","120","130","140","150"]),
      this.makeProduct("26031","库洛米翅膀纱裙","裙子",55,40,["紫色"],["100","110","120","130","140","150"]),
      this.makeProduct("26026","艾莎冰雪公主纱裙","裙子",75,60,["白色"],["100","110","120","130","140","150"]),
      this.makeProduct("25156","萝卜朱迪警官两件套洛","套装",78,42,["蓝色"],["100","110","120","130","140","150"]),
      this.makeProduct("25072","在逃白雪公主纱裙","裙子",69,45,["红色"],["100","110","120","130","140","150"]),
      this.makeProduct("26006","白雪公主纱裙","连衣裙",59,41,["黄色"],["100","110","120","130","140","150"]),
      this.makeProduct("25155","吊带网纱tutu裙套","套装",68,45,["粉色"],["100","110","120","130","140","150"]),
      this.makeProduct("25079","多巴胺背带裤套装","套装",45,28,["粉色"],["100","110","120","130","140","150"]),
      this.makeProduct("888","饰品配饰","配饰",7,2,["默认"],["均码"])
    ];
    const data = {version:VERSION, products, orders:[], cart:[], settings:{storeName:"NN童装",salesman:"李飞"}};
    const addSeed = (offset, items, tag="普通销售") => {
      data.orders.push({
        id: uid("O"),
        no: String(1170000 + data.orders.length + 1),
        createdTs: new Date(shiftDay(today(), offset)+"T12:00:00").getTime(),
        tag, storeName:"NN童装", salesman:"李飞", paymentMethod:"微信支付", note:"",
        isVoid:false, items:items.map(x => {
          const p = products.find(p => p.code === x.code) || {};
          return {code:x.code,name:p.name,color:x.color,size:x.size,qty:x.qty,price:p.price,cost:p.cost,lineType:x.qty < 0 ? "refund" : "sale"};
        })
      });
    };
    addSeed(0, [
      {code:"26195",color:"紫色",size:"110",qty:2},{code:"26195",color:"紫色",size:"120",qty:2},
      {code:"26195",color:"紫色",size:"130",qty:-2},
      {code:"6027",color:"绿色",size:"120",qty:2},
      {code:"26031",color:"紫色",size:"120",qty:1}
    ]);
    addSeed(-1, [
      {code:"26026",color:"白色",size:"120",qty:26},{code:"26031",color:"紫色",size:"110",qty:32},
      {code:"26031",color:"紫色",size:"130",qty:-4},{code:"25156",color:"蓝色",size:"120",qty:17}

    d.products.forEach(p => {

      p.stock = p.stock || {};
      p.colors.forEach(c => { p.stock[c] = p.stock[c] || {}; p.sizes.forEach(s => { p.stock[c][s] = n(p.stock[c][s]); }); });
      p.image = p.image || placeholderImg(p.code,p.name);

      Object.keys(p.skuPrices).forEach(k => {

    d.orders.forEach((o,idx) => {

      o.roundOff = Math.abs(n(o.roundOff || o.roundAmount || o.eraseZero || o.moling || o.maling || o.discountAmount));
      o.actualNetAmount = n(o.actualNetAmount || o.paidAmount || o.realAmount || 0);
      o.isVoid = !!o.isVoid;
      o.items = Array.isArray(o.items) ? o.items : [];

      // V2.16 旧数据兼容：
      // 早期版本有可能把“退货单”的 qty 存成正数。
      // 这里优先看订单标记和明细标记，最后才看 qty 正负，并统一转成：
      // 销售 qty > 0，退货 qty < 0。
      const orderText = String(o.type || o.orderType || o.orderTag || o.tag || o.status || o.paidStatus || o.title || "").toLowerCase();
      const orderIsRefund = /refund|return|退货|退款|已退款|退单/.test(orderText);

      o.items.forEach(i => {
        i.code = String(i.code || "");
        const p = d.products.find(p => p.code === i.code) || {};
        i.name = i.name || p.name || "";
        i.color = i.color || (p.colors && p.colors[0]) || "默认";

        const itemIsRefund = /refund|return|退货|退款|已退款|退单/.test(itemText);
        const shouldRefund = orderIsRefund || itemIsRefund || rawQty < 0;

        i.qty = shouldRefund ? -Math.abs(rawQty) : Math.abs(rawQty);
        i.price = n(i.price || p.price);
        i.cost = n(i.cost || p.cost);

  getProduct(code){ return data.products.find(p => String(p.code) === String(code)); },
  stockOf(p,color,size){ return n(p && p.stock && p.stock[color] && p.stock[color][size]); },
  setStock(p,color,size,qty){
    if(!p.stock) p.stock = {};
    if(!p.stock[color]) p.stock[color] = {};
    p.stock[color][size] = Math.max(0, n(qty));
  },
  totalStock(p){
    let s = 0;
    (p.colors || []).forEach(c => (p.sizes || []).forEach(z => s += this.stockOf(p,c,z)));
    return s;
  },
  skuKey(color,size){ return String(color || "默认") + ";" + String(size || "均码"); },
  getSkuInfo(p,color,size){
    const key = this.skuKey(color,size);
    const one = p && p.skuPrices ? (p.skuPrices[key] || {}) : {};
    return {price: n(one.price || (p && p.price) || 0), cost: n(one.cost || (p && p.cost) || 0)};
  },
  getSkuPrice(p,color,size){ return this.getSkuInfo(p,color,size).price; },
  getSkuCost(p,color,size){ return this.getSkuInfo(p,color,size).cost; },
  productStockAmounts(p){
    const out = {stock:0,cost:0,retail:0};
    (p.colors || []).forEach(c => (p.sizes || []).forEach(z => {
      const qty = this.stockOf(p,c,z);
      out.stock += qty;
      out.cost += qty * this.getSkuCost(p,c,z);
      out.retail += qty * this.getSkuPrice(p,c,z);
    }));
    return out;
  },
  isRefundLine(item){ return n(item.qty) < 0 || item.lineType === "refund"; },
  isSaleLine(item){ return n(item.qty) > 0 && item.lineType !== "refund"; },
  orderRoundOff(order){
    return Math.abs(n(order && (order.roundOff || order.roundAmount || order.eraseZero || order.moling || order.maling || order.discountAmount)));
  },
  netAfterRound(netAmount, roundOff){
    const r = Math.abs(n(roundOff));
    const v = n(netAmount);
    if(!r) return v;
    // 销售单：应收 78，抹零 8，实收 70
    // 退货单：应退 -78，抹零 8，实退 -70
    return v >= 0 ? Math.max(0, v - r) : Math.min(0, v + r);
  },
  orderBases(order){
    const b = {saleAmount:0, refundAmount:0, saleCost:0, refundCost:0, saleQty:0, refundQty:0};
    ((order && order.items) || []).forEach(i => {
      const q = Math.abs(n(i.qty));
      if(this.isRefundLine(i)){
        b.refundQty += q;
        b.refundAmount += q * n(i.price);
        b.refundCost += q * n(i.cost);
      }else if(n(i.qty) > 0){
        b.saleQty += q;
        b.saleAmount += q * n(i.price);
        b.saleCost += q * n(i.cost);
      }
    });
    return b;
  },
  adjustedLineAmount(order,item){
    const q = Math.abs(n(item && item.qty));
    const raw = q * n(item && item.price);
    const round = this.orderRoundOff(order);
    if(!round || !raw) return raw;
    const b = this.orderBases(order);
    // 抹零按订单实际方向分摊：
    // 销售为主的单，分摊到销售行；退货为主的单，分摊到退货行。
    if(this.isRefundLine(item) && b.refundAmount > b.saleAmount && b.refundAmount > 0){
      return Math.max(0, raw - round * raw / b.refundAmount);
    }
    if(this.isSaleLine(item) && b.saleAmount >= b.refundAmount && b.saleAmount > 0){
      return Math.max(0, raw - round * raw / b.saleAmount);
    }
    return raw;
  },
  getValidOrders(range){
    let os = data.orders.filter(o => !o.isVoid);
    const now = Date.now();
    if(range === "today") os = os.filter(o => fullDay(o.createdTs) === today());
    else if(range === "7") os = os.filter(o => n(o.createdTs) >= now - 7*86400000);
    else if(range === "30") os = os.filter(o => n(o.createdTs) >= now - 30*86400000);
    else if(range && range.start && range.end){
      const s = new Date(range.start+"T00:00:00").getTime();
      const e = new Date(range.end+"T23:59:59").getTime();
      os = os.filter(o => n(o.createdTs) >= s && n(o.createdTs) <= e);
    }
    return os;
  },
  calcOrderSummary(orders){
    const s = {
      orderCount:0,saleOrderCount:0,refundOrderCount:0,
      qty:0,amount:0,grossAmount:0,cost:0,
      refundQty:0,refundAmount:0,grossRefundAmount:0,refundCost:0,
      roundOff:0,netQty:0,netAmount:0,grossNetAmount:0,
      profit:0,margin:0,refundRate:0
    };
    (orders || []).forEach(o => {
      const b = this.orderBases(o);
      const round = this.orderRoundOff(o);
      const applyToRefund = b.refundAmount > b.saleAmount;

      let saleAmount = b.saleAmount;
      let refundAmount = b.refundAmount;
      if(round){
        if(applyToRefund && refundAmount > 0) refundAmount = Math.max(0, refundAmount - round);
        else if(saleAmount > 0) saleAmount = Math.max(0, saleAmount - round);
      }

      s.qty += b.saleQty;
      s.refundQty += b.refundQty;
      s.grossAmount += b.saleAmount;
      s.grossRefundAmount += b.refundAmount;
      s.amount += saleAmount;
      s.refundAmount += refundAmount;
      s.cost += b.saleCost;
      s.refundCost += b.refundCost;
      s.roundOff += round;

      if(b.saleQty > 0) s.saleOrderCount++;
      if(b.refundQty > 0) s.refundOrderCount++;
    });
    s.orderCount = (orders || []).length;
    s.netQty = s.qty - s.refundQty;
    s.grossNetAmount = s.grossAmount - s.grossRefundAmount;
    s.netAmount = s.amount - s.refundAmount;
    s.profit = (s.amount - s.cost) - (s.refundAmount - s.refundCost);
    s.margin = s.netAmount ? s.profit / s.netAmount * 100 : 0;
    s.refundRate = s.qty ? s.refundQty / s.qty * 100 : 0;
    return s;
  },
  calcProductStats(orders, keyword=""){
    const map = {};
    (orders || []).forEach(o => (o.items || []).forEach(i => {
      const code = String(i.code || ""); if(!code) return;
      if(!map[code]) map[code] = {code,qty:0,amount:0,cost:0,refundQty:0,refundAmount:0,refundCost:0,stock:0,available:0};
      const q = Math.abs(n(i.qty));
      const actualAmount = this.adjustedLineAmount(o,i);
      if(this.isRefundLine(i)){ map[code].refundQty += q; map[code].refundAmount += actualAmount; map[code].refundCost += q*n(i.cost); }
      else if(n(i.qty) > 0){ map[code].qty += q; map[code].amount += actualAmount; map[code].cost += q*n(i.cost); }
    }));
    let rows = Object.values(map).map(r => {
      const p = this.getProduct(r.code) || {};
      r.stock = this.totalStock(p);
      r.available = r.stock;
      return this.finishStats(r);
    });
    const kw = String(keyword || "").trim().toLowerCase();
    if(kw){
      rows = rows.filter(r => {
        const p = this.getProduct(r.code) || {};
        return (r.code+" "+(p.name||"")+" "+(p.category||"")).toLowerCase().includes(kw);
      });
    }
    rows.sort((a,b) => b.qty - a.qty || b.amount - a.amount || String(a.code).localeCompare(String(b.code)));
    return rows;
  },
  calcSKUStats(orders, code){
    const p = this.getProduct(code) || {};
    const map = {};
    (orders || []).forEach(o => (o.items || []).forEach(i => {
      if(String(i.code) !== String(code)) return;
      const key = (i.color || "") + ";" + (i.size || "");
      if(!map[key]) map[key] = {label:key, color:i.color, size:i.size, qty:0,amount:0,cost:0,refundQty:0,refundAmount:0,refundCost:0,stock:0,available:0};
      const q = Math.abs(n(i.qty));
      const actualAmount = this.adjustedLineAmount(o,i);
      if(this.isRefundLine(i)){ map[key].refundQty += q; map[key].refundAmount += actualAmount; map[key].refundCost += q*n(i.cost); }
      else if(n(i.qty) > 0){ map[key].qty += q; map[key].amount += actualAmount; map[key].cost += q*n(i.cost); }
    }));
    (p.colors || []).forEach(c => (p.sizes || []).forEach(z => {
      const key = c+";"+z;
      if(!map[key]) map[key] = {label:key,color:c,size:z,qty:0,amount:0,cost:0,refundQty:0,refundAmount:0,refundCost:0,stock:0,available:0};
    }));
    return Object.values(map).map(r => {
      r.stock = this.stockOf(p,r.color,r.size);
      r.available = r.stock;
      return this.finishStats(r);
    }).sort((a,b) => b.qty - a.qty || String(a.label).localeCompare(String(b.label)));
  },
  finishStats(r){
    r.netQty = n(r.qty) - n(r.refundQty);
    r.netAmount = n(r.amount) - n(r.refundAmount);
    r.profit = (n(r.amount) - n(r.cost)) - (n(r.refundAmount) - n(r.refundCost));
    r.margin = r.netAmount ? r.profit / r.netAmount * 100 : 0;
    r.refundRate = r.qty ? r.refundQty / r.qty * 100 : 0;
    r.avg = r.qty ? r.amount / r.qty : 0;
    return r;
  },
  applyStockChange(products, items, mode){
    (items || []).forEach(i => {
      const p = products.find(p => String(p.code) === String(i.code));
      if(!p) return;
      const sign = mode === "void" ? -1 : 1;
      const q = n(i.qty) * sign;
      const current = this.stockOf(p,i.color,i.size);
      // 创建订单：销售 qty>0 扣库存；退货 qty<0 加库存
      // 作废订单：反向恢复
      this.setStock(p,i.color,i.size,current - q);
    });
  },
  createOrder(items, extra){
    const clean = (items || []).filter(i => n(i.qty) !== 0).map(i => {
      const p = this.getProduct(i.code) || {};
      return {code:i.code,name:p.name,color:i.color,size:i.size,qty:n(i.qty),price:n(i.price || p.price),cost:n(i.cost || p.cost),lineType:n(i.qty)<0?"refund":"sale"};
    });
    if(!clean.length){ alert("请先选择商品数量"); return null; }
    const tempOrder = {items:clean};
    const base = this.orderBases(tempOrder);
    const roundOff = Math.abs(n(extra && extra.roundOff));
    const grossNetAmount = base.saleAmount - base.refundAmount;
    const actualNetAmount = this.netAfterRound(grossNetAmount, roundOff);

    const order = {
      id: uid("O"), no: String(1170000 + data.orders.length + 1),
      createdTs: Date.now(), storeName:"NN童装",
      salesman:(extra && extra.salesman) || data.settings.salesman || "李飞",
      paymentMethod:(extra && extra.paymentMethod) || "微信支付",
      note:(extra && extra.note) || "",
      roundOff, grossNetAmount, actualNetAmount,
      isVoid:false, items:clean
    };
    data.orders.unshift(order);
    this.applyStockChange(data.products, clean, "create");
    data.cart = [];
    this.save();
    return order;
  },
  voidOrder(id){
    const o = data.orders.find(o => o.id === id);
    if(!o || o.isVoid) return;
    if(!confirm("作废后会反向还原库存，确认作废？")) return;
    this.applyStockChange(data.products, o.items, "void");
    o.isVoid = true;
    o.voidTs = Date.now();
    this.save();
    UI.orders.openDetail(id);
  }
};

function productRetailPriceLabel(p){
  if(!p) return "0";
  const prices = [];
  if(p.multiPrice){
    (p.colors || []).forEach(c => (p.sizes || []).forEach(s => {
      const v = DataLayer.getSkuPrice(p,c,s);
      if(v > 0) prices.push(v);
    }));
  }
  if(!prices.length && n(p.price) > 0) prices.push(n(p.price));
  if(!prices.length) return "0";
  const min = Math.min.apply(null, prices);
  const max = Math.max.apply(null, prices);
  return min === max ? money(min) : money(min) + "-" + money(max);
}
function syncProductPresets(p){
  if(!p) return;
  data.settings.colorPresets = data.settings.colorPresets || [];
  data.settings.sizePresets = data.settings.sizePresets || [];
  (p.colors || []).forEach(c => {
    c = String(c || "").trim();
    if(c && !data.settings.colorPresets.includes(c)) data.settings.colorPresets.unshift(c);
  });
  const sizePreset = (p.sizes || []).map(x => String(x || "").trim()).filter(Boolean).join("、");
  if(sizePreset && !data.settings.sizePresets.includes(sizePreset)) data.settings.sizePresets.unshift(sizePreset);
}
function productManageStats(list){
  const stats = {stock:0,cost:0,retail:0};
  (list || []).forEach(p => {
    const one = DataLayer.productStockAmounts(p);
    stats.stock += one.stock;

function matchProductManage(p, keyword, mode){
  const kw = String(keyword || '').trim().toLowerCase();
  if(!kw) return true;
  const code = String(p.code || '').toLowerCase();
  const name = String(p.name || '').toLowerCase();
  const category = String(p.category || '').toLowerCase();
  if(mode === 'code') return code.includes(kw);
  if(mode === 'name') return name.includes(kw) || category.includes(kw);
  return (code + ' ' + name + ' ' + category).includes(kw);
}

function showPage(name){
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  const page = $("page-"+name);
  if(page) page.classList.add("active");

  const mainPages = ["sale","orders","report","me"];
  const isMainPage = mainPages.includes(name);
  const bottomNav = document.querySelector(".nav");
  if(bottomNav) bottomNav.style.display = isMainPage ? "" : "none";

  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  const nav = $("nav-"+name); if(nav) nav.classList.add("active");

  if(name === "sale") UI.sale.render();
  if(name === "orders") UI.orders.render();
  if(name === "report") UI.report.render();
  if(name === "me") UI.me.render();
  if(name === "cart-review") renderCartReview();
}

function openProductPicker(code){
  try{
    pickerCode = code;
    const p = DataLayer.getProduct(code);
    if(!p){ alert("商品不存在，请先到商品管理检查资料"); return; }

    const colors = Array.isArray(p.colors) && p.colors.length ? p.colors : [""];
    const sizes = Array.isArray(p.sizes) && p.sizes.length ? p.sizes : ["均码"];
    pickerDraft = {color:colors[0], qty:{}};

  // V2.35：从购物车进入或重复点击同款时，把该商品已选 SKU 带回选择页，方便继续修改数量。
  // 注意：这里只做内存临时移出，不立即 DataLayer.save()，避免点击商品时因本地存储过大导致脚本中断。
  const remain = [];
  (data.cart || []).forEach(i => {
    if(String(i.code) === String(code)){
      const key = (i.color || pickerDraft.color) + ";" + (i.size || "");
      pickerDraft.qty[key] = n(pickerDraft.qty[key]) + n(i.qty);
      if(i.color) pickerDraft.color = i.color;
    }else{
      remain.push(i);
    }
  });
  data.cart = remain;
  renderCartBadge();

    showPage("picker");
    UI.picker.render();
  }catch(e){
    console.error("openProductPicker failed", e);
    alert("商品选择页打开失败，请检查该商品的颜色、尺码、价格和库存资料");
  }
}
function closePicker(){
  mergePickerToCart();
  showPage("sale");
}
function setPickerColor(c){ pickerDraft.color = c; UI.picker.render(); }
function changePickerQty(size, delta){
  const p = DataLayer.getProduct(pickerCode); if(!p) return;
  const c = pickerDraft.color || p.colors[0];
  const key = c+";"+size;
  const cur = n(pickerDraft.qty[key]);
  const next = cur + delta;
  if(next > DataLayer.stockOf(p,c,size)){ alert("销售数量不能超过库存；退货请点减号"); return; }
  pickerDraft.qty[key] = next;
  UI.picker.render();
}
function batchPickerQty(delta){
  const p = DataLayer.getProduct(pickerCode); if(!p) return;
  const c = pickerDraft.color || p.colors[0];
  let blocked = false;
  (p.sizes || []).forEach(size => {
    const key = c+";"+size;
    const cur = n(pickerDraft.qty[key]);
    const next = cur + delta;
    if(delta > 0 && next > DataLayer.stockOf(p,c,size)){
      blocked = true;
      return;
    }
    pickerDraft.qty[key] = next;
  });
  UI.picker.render();
  if(blocked) alert("部分尺码库存不足，已跳过不能继续增加的 SKU");
}
function mergePickerToCart(){
  const p = DataLayer.getProduct(pickerCode);
  if(!p) return;
  Object.keys(pickerDraft.qty || {}).forEach(key => {
    const q = n(pickerDraft.qty[key]);
    if(!q) return;
    const [color,size] = key.split(";");
    const old = data.cart.find(i => i.code === p.code && i.color === color && i.size === size && (n(i.qty)>0) === (q>0));
    const skuPrice = DataLayer.getSkuPrice(p,color,size);
    const skuCost = DataLayer.getSkuCost(p,color,size);
    if(old) old.qty += q;
    else data.cart.push({code:p.code,color,size,qty:q,price:skuPrice,cost:skuCost,lineType:q<0?"refund":"sale"});
  });
  pickerDraft.qty = {};
  DataLayer.save();
  renderCartBadge();
}
function continueSelect(){ mergePickerToCart(); showPage("sale"); }

  openCartReview();

function openCartReview(){

function renderCartReview(){
  const box = $("cartReviewList");
  const total = $("cartReviewTotal");
  if(!box || !total) return;
  const grouped = {};
  (data.cart || []).forEach(i => {
    if(!grouped[i.code]) grouped[i.code] = [];
    grouped[i.code].push(i);
  });
  const htmlRows = Object.keys(grouped).map(code => {
    const p = DataLayer.getProduct(code) || {code, name:"", category:"", image:placeholderImg(code,"商品"), sizes:[]};
    const items = grouped[code];
    const sizes = (p.sizes && p.sizes.length ? p.sizes : Array.from(new Set(items.map(i => i.size)))).slice(0,6);
    const colors = Array.from(new Set(items.map(i => i.color || "")));
    const saleQty = items.reduce((s,i) => s + Math.max(0,n(i.qty)),0);
    const refundQty = items.reduce((s,i) => s + Math.max(0,-n(i.qty)),0);
    const netQtyText = refundQty ? `${saleQty}/-${refundQty}` : `${saleQty}`;
    const netAmount = items.reduce((s,i) => s + n(i.qty)*n(i.price),0);
    const price = items.length ? n(items[0].price) : n(p.price);
    const colorRows = colors.map(c => {
      const cols = sizes.map(sz => {
        const q = items.filter(i => String(i.color||"") === String(c) && String(i.size||"") === String(sz)).reduce((s,i)=>s+n(i.qty),0);
        return `<div class="${q<0?'red':''}">${q || 0}</div>`;
      }).join("");
      return `<div class="cart-review-row"><div class="first">${esc(c || "未设颜色")}</div>${cols}</div>`;
    }).join("");
    return `<div class="cart-review-swipe" data-code="${esc(code)}">
      <button class="cart-review-delete" type="button">删除</button>
      <div class="cart-review-card" data-code="${esc(code)}">
        <div class="cart-review-main">
          <img class="cart-review-img" src="${esc(p.image || placeholderImg(p.code,p.name))}">
          <div>
            <div class="cart-review-title">${esc(p.code)}${esc(p.name)}</div>
            <div class="cart-review-cat">${esc(p.category || "")}</div>
            <div class="cart-review-price">${money(price)} ›</div>
          </div>
          <div>
            <div class="cart-review-num">${netQtyText}</div>
            <div class="cart-review-amount">${money(netAmount)}</div>
          </div>
        </div>
        <div class="cart-review-sku">
          <div class="cart-review-grid">
            <div class="cart-review-row head"><div class="first">规格</div>${sizes.map(s=>`<div>${esc(s)}</div>`).join("")}</div>
            ${colorRows}
          </div>
        </div>
      </div>
    </div>`;
  }).join("");
  box.innerHTML = htmlRows || `<div class="pa-empty">暂无选款</div>`;
  total.innerHTML = cartSummaryText(calcCartSummary());
  initCartReviewSwipe();
}
function deleteCartReviewProduct(code){
  code = String(code || "");
  if(!code) return;
  data.cart = (data.cart || []).filter(i => String(i.code) !== code);
  DataLayer.save();
  renderCartBadge();
  renderCartReview();
}
function initCartReviewSwipe(){
  const rows = Array.from(document.querySelectorAll("#cartReviewList .cart-review-swipe[data-code]"));
  rows.forEach(row => {
    const card = row.querySelector(".cart-review-card");
    const del = row.querySelector(".cart-review-delete");
    let sx = 0, sy = 0, dx = 0, dy = 0, moved = false;
    row.addEventListener("touchstart", e => {
      const t = e.touches && e.touches[0];
      if(!t) return;
      sx = t.clientX; sy = t.clientY; dx = 0; dy = 0; moved = false;
    }, {passive:true});
    row.addEventListener("touchmove", e => {
      const t = e.touches && e.touches[0];
      if(!t) return;
      dx = t.clientX - sx; dy = t.clientY - sy;
      if(Math.abs(dx) > 24 && Math.abs(dx) > Math.abs(dy) * 1.2) moved = true;
    }, {passive:true});
    row.addEventListener("touchend", () => {
      if(!moved) return;
      rows.forEach(r => { if(r !== row) r.classList.remove("swiped"); });
      if(dx < -38) row.classList.add("swiped");
      if(dx > 28) row.classList.remove("swiped");
      row.dataset.justSwiped = String(Date.now());
    }, {passive:true});
    if(card){
      card.onclick = e => {
        const just = Date.now() - n(row.dataset.justSwiped);
        if(row.classList.contains("swiped") || just < 260){
          e.preventDefault();
          e.stopPropagation();
          row.classList.remove("swiped");
          return;
        }
        openProductPicker(row.dataset.code || "");
      };
    }
    if(del){
      del.onclick = e => {
        e.preventDefault();
        e.stopPropagation();
        deleteCartReviewProduct(row.dataset.code || "");
      };
    }
  });
}

function calcCartSummary(){
  const s = {saleQty:0,refundQty:0,absQty:0,amount:0,refundAmount:0,netAmount:0};
  data.cart.forEach(i => {
    const q = n(i.qty);
    s.absQty += Math.abs(q);
    if(q > 0){ s.saleQty += q; s.amount += q*n(i.price); }
    else if(q < 0){ s.refundQty += Math.abs(q); s.refundAmount += Math.abs(q)*n(i.price); }
  });
  s.netAmount = s.amount - s.refundAmount;
  return s;
}
function addLineToSummary(s, q, price){
  q = n(q); price = n(price);
  s.absQty += Math.abs(q);
  if(q > 0){ s.saleQty += q; s.amount += q*price; }
  else if(q < 0){ s.refundQty += Math.abs(q); s.refundAmount += Math.abs(q)*price; }
  s.netAmount = s.amount - s.refundAmount;
  return s;
}
function calcPickerSummary(){
  const s = calcCartSummary();
  const p = DataLayer.getProduct(pickerCode);
  if(!p) return s;
  const colors = Array.isArray(p.colors) && p.colors.length ? p.colors : [""];
  const c = pickerDraft.color || colors[0];
  Object.keys(pickerDraft.qty || {}).forEach(key => {
    const q = n(pickerDraft.qty[key]);
    if(!q) return;
    const parts = key.split(";");
    const color = parts[0] || c;
    const size = parts[1] || "";
    addLineToSummary(s, q, DataLayer.getSkuPrice(p,color,size));
  });
  return s;
}
function cartSummaryText(s){
  s = s || {saleQty:0,qty:0,refundQty:0,netAmount:0};
  const saleQty = n(s.saleQty != null ? s.saleQty : s.qty);
  const refundQty = n(s.refundQty);
  const parts = [];
  if(saleQty > 0) parts.push(`售${saleQty}件`);
  if(refundQty > 0) parts.push(`退${refundQty}件`);
  if(!parts.length) parts.push("售0件");
  return `${parts.join(" ")} ${money(s.netAmount)}`;
}

function shiftMonth(key, delta){
  const [y,m] = String(key).split("-").map(Number);
  const d = new Date(y, (m||1)-1 + delta, 1);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");

  const fmt = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  return {start:fmt(start), end:fmt(end)};
}

function buildBaSeries(){
  const points = [];
  if(baState.mode === "day"){
    for(let i=8;i>=0;i--){
      const day = shiftDay(baState.anchor, -i);
      points.push({...salesDetailSummary({start:day,end:day}), label:md(day), day});
    }
  }else if(baState.mode === "week"){
    for(let i=7;i>=0;i--){
      const end = shiftDay(baState.anchor, -7*i);
      points.push({...salesDetailSummary(baWeekRange(end)), label:md(end), day:end});
    }
  }else if(baState.mode === "month"){
    for(let i=5;i>=0;i--){
      const key = shiftMonth(baState.anchor, -i);
      points.push({...salesDetailSummary(monthRange(key)), label:key.slice(5).replace("-", "."), day:key});
    }
  }else if(baState.mode === "7" || baState.mode === "30"){
    const span = baState.mode === "7" ? 6 : 29;
    for(let i=8;i>=0;i--){
      const end = shiftDay(baState.anchor, -i);
      points.push({...salesDetailSummary({start:shiftDay(end,-span), end}), label:md(end), day:end});
    }
  }else{
    let cur = baState.custom.start;
    while(cur <= baState.custom.end && points.length < 31){
      points.push({...salesDetailSummary({start:cur,end:cur}), label:md(cur), day:cur});
      cur = shiftDay(cur, 1);
    }
  }
  return points;
}
function baRingText(current, prev){
  if(!prev) return {text:"环比 --", cls:"sub ba-ring flat"};
  const rate = (n(current)-n(prev))/Math.abs(n(prev))*100;
  const val = (rate>0?"+":"") + rate.toFixed(2) + "%";
  return {text:"环比 " + val, cls:"sub ba-ring " + (rate>0?"up":rate<0?"down":"flat")};
}

function syncPaTotalScroll(){
  const grid = $("paGrid");
  const total = $("paTotalFixed");
  if(!grid || !total || grid.dataset.syncTotal === "1") return;
  let locking = false;
  grid.addEventListener("scroll", () => {
    if(locking) return;
    locking = true;
    total.scrollLeft = grid.scrollLeft;
    requestAnimationFrame(() => locking = false);
  }, {passive:true});
  total.addEventListener("scroll", () => {
    if(locking) return;
    locking = true;
    grid.scrollLeft = total.scrollLeft;
    requestAnimationFrame(() => locking = false);
  }, {passive:true});
  grid.dataset.syncTotal = "1";
}

function handleProductImageUpload(event){
  const file = event && event.target && event.target.files && event.target.files[0];
  if(!file || !productDraft) return;
  if(!/^image\//.test(file.type || "")){ alert("请选择图片文件"); return; }

  // V2.37：上传图片自动压缩版
  // 关键点：绝不再直接保存原图 Base64，避免 localStorage 空间爆掉，导致商品保存失败或商品消失。
  const objectUrl = URL.createObjectURL(file);
  const img = new Image();

  img.onload = function(){
    try{
      const maxEdge = 260;       // 商品页只显示缩略图，260px 足够清晰，体积更稳
      const targetLen = 9000;    // 目标控制在约 9KB 以内，适合手机 localStorage
      const maxSide = Math.max(1, img.width, img.height);
      const scale = Math.min(1, maxEdge / maxSide);
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));

      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d", {alpha:false});
      ctx.fillStyle = "#fff";
      ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);

      let quality = 0.62;
      let dataUrl = canvas.toDataURL("image/jpeg", quality);

      // 如果仍偏大，逐步降低质量
      while(dataUrl.length > targetLen && quality > 0.32){
        quality = Math.max(0.32, quality - 0.08);
        dataUrl = canvas.toDataURL("image/jpeg", quality);
      }

      // 如果还偏大，继续降低尺寸再压一次
      if(dataUrl.length > targetLen){
        const smallCanvas = document.createElement("canvas");
        const smallScale = 200 / Math.max(w,h);
        smallCanvas.width = Math.max(1, Math.round(w * smallScale));
        smallCanvas.height = Math.max(1, Math.round(h * smallScale));
        const sctx = smallCanvas.getContext("2d", {alpha:false});
        sctx.fillStyle = "#fff";
        sctx.fillRect(0,0,smallCanvas.width,smallCanvas.height);
        sctx.drawImage(canvas,0,0,smallCanvas.width,smallCanvas.height);
        dataUrl = smallCanvas.toDataURL("image/jpeg", 0.36);
      }

      URL.revokeObjectURL(objectUrl);
      productDraft.image = dataUrl;
      renderProductEdit();
    }catch(e){
      URL.revokeObjectURL(objectUrl);
      console.error("图片压缩失败", e);
      // 压缩失败也不保存原图，避免再次引发本地空间不足
      productDraft.image = placeholderImg(productDraft.code || "商品", productDraft.name || "商品");
      renderProductEdit();
      alert("图片压缩失败，已使用占位图，商品资料可以正常保存。");
    }
  };

  img.onerror = function(){
    URL.revokeObjectURL(objectUrl);
    productDraft.image = placeholderImg(productDraft.code || "商品", productDraft.name || "商品");
    renderProductEdit();
    alert("图片读取失败，已使用占位图。");
  };

  img.src = objectUrl;
}

  productDraft.colors.forEach(c => productDraft.sizes.forEach(s => rows.push({color:c,size:s,key:DataLayer.skuKey(c,s)})));
  $("productStockBox").innerHTML = `<div class="picker-topbar"><div class="left"><button class="icon-btn" onclick="backFromProductStock()">‹</button></div><div class="title">库存</div><div style="width:36px"></div></div>
    <div class="matrix-wrap"><div class="stock-total-tip">当前库存总数：<span id="draftStockTotal">${draftTotalStock()}</span></div>
      <table class="matrix-table"><thead><tr><th>规格</th><th>库存</th></tr></thead><tbody>${rows.map(r => {
        const label = productDraft.colors.length > 1 && productDraft.sizes.length > 1 ? `${r.color}/${r.size}` : (productDraft.colors.length > 1 ? r.color : r.size);
        const val = n(productDraft.stock && productDraft.stock[r.color] && productDraft.stock[r.color][r.size]);
        return `<tr><td>${esc(label)}</td><td><input type="number" inputmode="decimal" pattern="[0-9.]*" value="${numInputValue(val)}" oninput="setDraftStock('${r.color}','${r.size}',this.value)" onchange="setDraftStock('${r.color}','${r.size}',this.value)"></td></tr>`;
      }).join('')}</tbody></table>
      <div class="matrix-foot"><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><button class="btn btn-light" onclick="batchSetDraftStock()">批量设置</button><button class="btn btn-blue" onclick="saveProductStockPage()">确认</button></div><button class="small-btn btn-line" style="margin-top:10px;width:100%" onclick="backFromProductStock()">取消本次库存修改</button></div>
    </div>`;
  showPage('product-stock');
}
function setDraftStock(color,size,value){
  productDraft.stock = productDraft.stock || {};
  productDraft.stock[color] = productDraft.stock[color] || {};
  productDraft.stock[color][size] = Math.max(0, n(value));
  const totalEl = $("draftStockTotal");
  if(totalEl) totalEl.innerText = draftTotalStock();
}
function batchSetDraftStock(){
  if(!productDraft) return;
  const val = prompt("请输入要批量设置的库存数量", "");
  if(val === null) return;
  const qty = Math.max(0, n(val));
  ensureProductDraftStockAndPrices();
  productDraft.colors.forEach(c => {
    productDraft.stock[c] = productDraft.stock[c] || {};
    productDraft.sizes.forEach(s => productDraft.stock[c][s] = qty);
  });
  openProductStockPage();
}
function backFromProductStock(){
  if(productStockEditing && productStockBackup){
    try{ productDraft.stock = JSON.parse(productStockBackup); }catch(e){}
  }
  productStockEditing = false;
  productStockBackup = null;
  renderProductEdit();
  showPage('product-edit');
}
function saveProductStockPage(){
  productStockEditing = false;
  productStockBackup = null;
  renderProductEdit();
  showPage('product-edit');
}
function saveProductEdit(){
  syncDraftBasicFields();
  if(!productDraft.code || !productDraft.name){ alert('款号和名称不能为空'); return; }
  ensureProductDraftStockAndPrices();

  const productsBackup = JSON.stringify(data.products);
  let p = editProductCode ? DataLayer.getProduct(editProductCode) : null;

  if(!p){
    if(DataLayer.getProduct(productDraft.code)){ alert('该款号已存在'); return; }
    p = {code:productDraft.code};
    data.products.unshift(p);
  }else if(editProductCode !== productDraft.code && DataLayer.getProduct(productDraft.code)){
    alert('修改后的款号已存在'); return;
  }

  Object.assign(p, JSON.parse(JSON.stringify(productDraft)));
  if(!p.createdTs) p.createdTs = Date.now();
  if(!p.image) p.image = placeholderImg(p.code,p.name);
  syncProductPresets(p);

  if(!p.multiPrice){
    Object.keys(p.skuPrices || {}).forEach(k => { p.skuPrices[k] = {price:n(p.price), cost:n(p.cost)}; });
  }

  const ok = DataLayer.save();
  if(!ok){
    try{ data.products = JSON.parse(productsBackup); }catch(e){}
    renderProductEdit();
    return;
  }

  const msg = DataLayer._lastSaveNote || '保存成功';
  DataLayer._lastSaveNote = "";
  alert(msg);
  showPage('me');
}
function openImagePreview(e,src){ e && e.stopPropagation(); $("imageModalImg").src = src; $("imageModal").style.display = "flex"; }
function closeImagePreview(){ $("imageModal").style.display = "none"; }

function verifyDataConsistency(){
  const issues = [];
  const warnings = [];

  const productMap = {};
  data.products.forEach(p => {
    if(!p.code) issues.push("发现无货号商品资料");
    if(productMap[p.code]) issues.push(`商品货号重复：${p.code}`);
    productMap[p.code] = p;

    (p.colors || []).forEach(c => (p.sizes || []).forEach(s => {
      const stock = DataLayer.stockOf(p,c,s);
      if(stock < 0) issues.push(`${p.code} ${c}/${s} 库存为负：${stock}`);
    }));

    if(!Array.isArray(p.colors) || !p.colors.length) warnings.push(`${p.code} 缺少颜色资料`);
    if(!Array.isArray(p.sizes) || !p.sizes.length) warnings.push(`${p.code} 缺少尺码资料`);
  });

  data.orders.forEach(o => {
    if(!o.items || !o.items.length){
      issues.push(`订单 ${o.no || o.id} 无商品明细`);
      return;
    }

    o.items.forEach(i => {
      const p = productMap[i.code];
      if(!p){
        issues.push(`订单 ${o.no || o.id} 中商品 ${i.code || "空货号"} 找不到商品资料`);
        return;
      }

      if(!p.colors.includes(i.color)) warnings.push(`订单 ${o.no || o.id}：${i.code} 颜色 ${i.color} 不在商品资料中`);
      if(!p.sizes.includes(i.size)) warnings.push(`订单 ${o.no || o.id}：${i.code} 尺码 ${i.size} 不在商品资料中`);

      if(!n(i.qty)) issues.push(`订单 ${o.no || o.id}：${i.code} 数量为 0`);
      if(n(i.price) < 0) issues.push(`订单 ${o.no || o.id}：${i.code} 单价为负`);
      if(n(i.cost) < 0) issues.push(`订单 ${o.no || o.id}：${i.code} 成本为负`);

      const shouldRefund = DataLayer.isRefundLine(i);
      if(shouldRefund && n(i.qty) > 0){
        issues.push(`订单 ${o.no || o.id}：${i.code} 标记为退货，但 qty 是正数`);
      }
      if(!shouldRefund && n(i.qty) < 0){
        issues.push(`订单 ${o.no || o.id}：${i.code} 标记为销售，但 qty 是负数`);
      }
    });
  });

  const validOrders = DataLayer.getValidOrders("all");
  const summary = DataLayer.calcOrderSummary(validOrders);
  const lines = [
    `有效单据：${validOrders.length} 张`,
    `销售件数：${Math.round(summary.qty)} 件`,
    `退货件数：${Math.round(summary.refundQty)} 件`,
    `净销量：${Math.round(summary.netQty)} 件`,
    `销售金额：${money(summary.amount)}`,
    `退货金额：${money(summary.refundAmount)}`,
    `抹零金额：${money(summary.roundOff)}`,
    `净收入：${money(summary.netAmount)}`,
    `毛利：${money(summary.profit)}`
  ];

  let msg = "数据一致性检查完成\\n\\n" + lines.join("\\n");

  if(issues.length){
    msg += "\\n\\n发现严重问题：\\n" + issues.slice(0,20).join("\\n");
    if(issues.length > 20) msg += `\\n……还有 ${issues.length - 20} 条`;
  }else{
    msg += "\\n\\n严重问题：0 条";
  }

  if(warnings.length){
    msg += "\\n\\n提醒：\\n" + warnings.slice(0,20).join("\\n");
    if(warnings.length > 20) msg += `\\n……还有 ${warnings.length - 20} 条`;
  }else{
    msg += "\\n提醒：0 条";
  }

  alert(msg);
}

function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "八方来财销售开单版数据备份_"+today()+".json";
  a.click();
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      data = DataLayer.normalizeData(JSON.parse(reader.result));
      DataLayer.save();
      alert("数据已恢复");
      showPage("me");
    }catch(err){ alert("备份文件格式不正确"); }
  };
  reader.readAsText(file);
}

function init(){
  DataLayer.save();
  UI.sale.render();
}
init();
</script>
