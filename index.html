<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>八方来财销售开单版 V1.1</title>
<style>
:root{--blue:#2f6df6;--green:#18a058;--red:#ef4444;--orange:#ff7a1a;--bg:#f3f5f9;--card:#fff;--text:#1f2937;--muted:#8791a3;--line:#e8edf5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)}
button,input,select,textarea{font-family:inherit}button{border:0;background:none}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:86px;background:var(--bg)}
.topbar{height:56px;background:#fff;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);font-size:20px;font-weight:900}
.topbar .left,.topbar .right{position:absolute;top:0;height:56px;display:flex;align-items:center}.topbar .left{left:12px}.topbar .right{right:12px}
.icon-btn{font-size:24px;color:#111827;padding:6px 8px}.page{display:none}.page.active{display:block}
.card{background:#fff;border-radius:16px;margin:14px 16px;padding:16px;box-shadow:0 8px 24px rgba(22,34,60,.05)}
.title{font-size:22px;font-weight:900;margin:0 0 14px}.sub{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
input,select,textarea{width:100%;border:1px solid #dbe1ea;border-radius:12px;background:#fff;height:44px;padding:0 12px;font-size:16px;outline:none;color:var(--text)}
textarea{height:72px;padding:10px 12px;resize:none}label{display:block;font-weight:900;font-size:14px;margin:8px 0 6px}
.btn{min-height:46px;border-radius:12px;padding:0 16px;font-weight:900;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn-blue{background:var(--blue);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-red{background:var(--red);color:#fff}.btn-gray{background:#edf1f7;color:#111827}.btn-light{background:#eaf2ff;color:#2563eb}
.btn-small{min-height:34px;border-radius:10px;font-size:13px;padding:0 10px;font-weight:900}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#fff;border-top:1px solid var(--line)}.nav-inner{max-width:560px;margin:0 auto;height:72px;display:grid;grid-template-columns:repeat(4,1fr)}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7b8494;font-weight:800;font-size:12px;gap:4px}.nav-item .ico{font-size:24px}.nav-item.active{color:#1887ff}
.tabs{display:flex;align-items:center;justify-content:center;background:#fff;height:48px;gap:42px;font-size:16px;position:sticky;top:56px;z-index:18;border-bottom:1px solid var(--line)}
.tabs button{font-size:17px;color:#111827;padding:12px 2px;border-bottom:3px solid transparent}.tabs button.active{color:var(--blue);border-color:var(--blue);font-weight:900}
.searchbar{position:sticky;bottom:72px;z-index:25;background:#fff;padding:10px 16px;border-top:1px solid var(--line)}
.searchbox{display:flex;align-items:center;border:1px solid #111827;border-radius:3px;height:44px;background:#fff;padding:0 10px;gap:8px}.searchbox input{border:0;height:40px;padding:0}
.product-list{padding:10px 0 78px}.product-row{background:#fff;margin:0 14px 10px;padding:12px;display:grid;grid-template-columns:74px 1fr 72px;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
.thumb{width:74px;height:74px;border-radius:6px;object-fit:cover;background:#f3f4f6;border:1px solid #edf1f7}.thumb.sm{width:58px;height:58px}.thumb.lg{width:112px;height:112px;border-radius:10px}
.product-name{font-weight:900;font-size:19px;line-height:1.25}.product-cat{font-size:14px;color:#7b8494;margin-top:5px}.price{font-size:17px;font-weight:800;text-align:right}
.pick-head{background:#fff;padding:14px 16px;display:grid;grid-template-columns:112px 1fr 30px;gap:12px;border-bottom:1px solid var(--line)}.pick-title{font-size:20px;font-weight:900;line-height:1.25}
.color-chip{display:inline-flex;border:1px solid #cfd8e6;border-radius:6px;padding:8px 12px;color:#2563eb;font-weight:900;background:#f7faff;margin:8px 6px 8px 0}.color-chip.active{border-color:var(--blue);background:#edf4ff}
.size-table{width:100%;border-collapse:collapse;background:#fff;margin-top:12px}.size-table th,.size-table td{padding:12px 4px;text-align:center;border-bottom:1px solid #f0f2f5;font-size:15px}.size-table th{background:#fafafa;color:#4b5563;font-weight:900}
.qty-step{display:inline-flex;align-items:center;gap:12px}.qty-step button{font-size:30px;font-weight:900;color:#7c879a;min-width:30px}.qty-num{font-size:18px;font-weight:900;min-width:22px}
.bottom-bar{position:fixed;left:0;right:0;bottom:72px;background:#fff;border-top:1px solid var(--line);z-index:60}.bottom-inner{max-width:560px;margin:0 auto;padding:10px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center}
.cart-total{font-size:16px;font-weight:900}.cart-total b{color:var(--blue);font-size:24px}.cart-detail{font-size:13px;color:#6b7280}
.cart-row{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.cart-row .name{font-weight:900}
.checkout-line{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);font-size:16px}.checkout-line strong{font-size:22px;color:#ef4444}
.pay-row{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:#fff;font-size:16px}.pay-row input{width:130px;text-align:right;border:0;background:transparent}
.success-box{background:#fff;margin:24px 16px;border-radius:14px;padding:28px 20px;text-align:center}.success-icon{width:82px;height:82px;border-radius:50%;background:#22c55e;color:#fff;margin:0 auto 16px;font-size:52px;display:flex;align-items:center;justify-content:center}
.info-list{background:#fff;border-radius:14px;overflow:hidden}.info-line{display:grid;grid-template-columns:116px 1fr auto;gap:8px;min-height:42px;padding:8px 12px;border-bottom:1px solid #f1f3f7;align-items:center}.info-line .k{color:#8b94a6}.info-line .v{font-weight:700}
.order-card{background:#fff;border-radius:12px;margin:12px 16px;padding:14px}.order-top{display:flex;justify-content:space-between;color:#8b94a6;font-size:14px}.order-customer{font-size:20px;font-weight:900;margin:12px 0}.order-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.order-stat{background:#f6f8fb;padding:12px 14px;font-size:16px;line-height:1.7}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-weight:900;font-size:13px}.tag.ok{background:#e8f8ef;color:#12804a}.tag.warn{background:#fff3d8;color:#a66a00}.tag.bad{background:#ffe9ea;color:#d11f2d}.tag.gray{background:#eef2f7;color:#4b5563}
.filterbar{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}.filterbar button,.filterbar select{height:38px;border:0;background:#fff;font-size:15px;white-space:nowrap}
.report-head{height:54px;display:flex;align-items:center;justify-content:space-around;background:#fff;border-bottom:1px solid var(--line)}.report-card{background:#fff;border-radius:10px;margin:12px 16px;padding:16px}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;text-align:center}.metric .label{font-size:14px;color:#4b5563}.metric .value{font-size:22px;font-weight:900;margin:8px 0 4px}.metric .trend{font-size:12px;color:#12a56f}
.analysis-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 16px}.analysis-card{background:#fff;border:1px solid #dbe5f7;border-radius:9px;padding:14px 10px;min-height:108px}.analysis-card.active{background:#f1f6ff;border-color:#87a9ff}.analysis-card .num{font-size:22px;font-weight:900;color:#2563eb}.analysis-card .txt{font-size:13px;color:#6b7280;margin-top:6px}.chart-card{background:#fff;margin:12px 16px;padding:16px;border-radius:10px}.svg-chart{width:100%;height:220px}
.product-analysis{background:#fff;margin:12px 0;overflow-x:auto}.product-analysis table{width:max-content;min-width:760px;border-collapse:collapse}.product-analysis th,.product-analysis td{padding:12px 14px;border-bottom:1px solid #f1f3f7;text-align:center;white-space:nowrap}.product-analysis th{background:#fafafa;color:#6b7280;font-weight:800}.pa-product{display:flex;align-items:center;gap:8px;text-align:left;color:#ef624f;font-weight:800;width:160px;white-space:normal}.pa-product img{width:52px;height:52px;border-radius:4px;object-fit:cover}
.form-img-panel{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;background:#fafbff;padding:10px}.img-preview{width:92px;height:92px;border:1px dashed #cfd8e6;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#9aa2b1;font-size:13px}.img-preview img{width:100%;height:100%;object-fit:cover}
.empty{padding:18px;text-align:center;color:#8b94a6}.small-link{color:#2563eb;font-weight:900}.product-manage-row{display:grid;grid-template-columns:66px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.product-manage-row img{width:66px;height:66px;border-radius:8px;object-fit:cover}.stock-mini{font-size:12px;color:#7b8494;margin-top:4px}
.image-modal{position:fixed;inset:0;z-index:999;background:rgba(15,23,42,.82);display:none;align-items:center;justify-content:center;padding:22px}.image-modal.show{display:flex}.image-modal img{max-width:100%;max-height:88vh;border-radius:16px;background:#fff}

/* V1.1 单据日期筛选、作废、修改订单 */
.date-sheet{background:#fff;border-bottom:1px solid var(--line);box-shadow:0 8px 24px rgba(15,23,42,.08);position:relative;z-index:40}
.date-option{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #f1f3f7;font-size:18px;background:#fff}
.date-option.active{color:var(--blue);font-weight:900}
.edit-banner{margin:0;background:#fff1f2;color:#ef4444;padding:12px 16px;font-weight:900;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffe0e3}
.edit-banner button{border:1px solid #f3a6ad;color:#ef4444;border-radius:8px;padding:7px 12px;font-weight:900;background:#fff}
.void-line{color:#ef4444;font-weight:900}
.order-card.void{opacity:.72}
.order-card.void .order-customer::after{content:" 已作废";display:inline-block;margin-left:8px;background:#ffe9ea;color:#d11f2d;border-radius:999px;padding:3px 8px;font-size:12px}
.detail-actions-4{grid-template-columns:80px 80px 1fr 1fr!important}

</style>
</head>
<body>
<div class="app">
  <div class="topbar"><span id="topTitle">八方来财销售开单版 V1.1</span><div class="left" id="topLeft"></div><div class="right" id="topRight"></div></div>
  <section id="page-sale" class="page active"><div class="tabs"><button id="tab-hot" class="active" onclick="setSaleTab('hot')">热卖</button><button id="tab-new" onclick="setSaleTab('new')">新款</button><button id="tab-bought" onclick="setSaleTab('bought')">买过</button></div><div class="product-list" id="saleProductList"></div><div class="searchbar"><div class="searchbox"><span style="font-size:24px">⌕</span><input id="saleSearch" placeholder="搜索款号/商品名称或扫码款号" oninput="renderSaleProducts()"><button onclick="alert('扫码功能后期接小程序摄像头接口')">▣</button></div></div></section>
  <section id="page-pick" class="page"><div id="pickBox"></div><div class="bottom-bar"><div class="bottom-inner"><button class="btn btn-light" onclick="addCurrentSelection(false)">继续选款</button><button class="btn btn-blue" onclick="addCurrentSelection(true)">立即结算</button></div></div></section>
  <section id="page-cart" class="page"><div class="card"><div class="row"><div class="title">销售清单</div><button class="btn-small btn-gray" onclick="showPage('sale')">继续选款</button></div><div id="cartList"></div></div><div class="bottom-bar"><div class="bottom-inner"><div class="cart-total">共 <b id="cartQty">0</b> 件<br><span class="cart-detail">合计 <span id="cartAmount">0.00</span></span></div><button class="btn btn-blue" id="cartActionBtn" onclick="handleCartMainAction()">去结算</button></div></div></section>
  <section id="page-checkout" class="page"><div class="card"><div class="title">收款结算</div><div><div class="checkout-line"><span>数量 / 金额</span><b id="checkoutQtyAmount">0件 / 0.00</b></div><div class="checkout-line"><span>抹零金额</span><input id="roundOff" type="number" value="0" oninput="renderCheckout()" style="width:110px;text-align:right"></div><div class="checkout-line"><span>待收金额</span><strong id="receivable">0.00</strong></div></div><div class="grid2"><div><label>客户</label><input id="customerName" value="散客"></div><div><label>业务员</label><input id="salesman" value="李飞"></div></div><div class="grid2"><div><label>发货方式</label><select id="shipMethod"><option>现场取货</option><option>快递</option></select></div><div><label>发货仓</label><select id="warehouse"><option>主仓</option><option>备用仓</option></select></div></div><label>订单标签</label><select id="orderTag"><option>普通销售</option><option>代客下单</option><option>线上订单</option></select><label>备注</label><textarea id="orderNote" placeholder="请输入备注"></textarea><label>附件</label><div class="form-img-panel"><div id="orderAttachPreview" class="img-preview">无附件</div><div><input type="file" id="orderAttachFile" accept="image/*" onchange="handleOrderAttach(event)"><button class="btn-small btn-gray" onclick="clearOrderAttach()">删除附件</button><div class="sub">可上传收款截图、客户备注截图等</div></div></div></div><div class="card"><div class="title">立即收款</div><div class="pay-row"><span>微信支付</span><input id="payWechat" type="number"></div><div class="pay-row"><span>支付宝</span><input id="payAlipay" type="number" value="0"></div><div class="pay-row"><span>银行卡</span><input id="payBank" type="number" value="0"></div><div class="pay-row"><span>现金支付</span><input id="payCash" type="number" value="0"></div><div class="sub" style="margin-top:10px">第一版先手动记录收款方式，后期小程序版可接真实支付接口。</div></div><div class="bottom-bar"><div class="bottom-inner"><button class="btn btn-light" onclick="alert('扫码收款后期接支付接口')">扫码收款</button><button class="btn btn-blue" onclick="confirmPayment()">确认收款</button></div></div></section>
  <section id="page-success" class="page"><div id="successBox"></div></section>
  <section id="page-orders" class="page"><div class="filterbar"><button>选择客户 ›</button><select id="shipFilter" onchange="renderOrders()"><option value="all">发货状态</option><option value="全部发货">全部发货</option><option value="未发货">未发货</option><option value="已作废">已作废</option></select><button id="orderDateBtn" onclick="toggleOrderDateMenu()">今天 ▾</button><button>更多筛选</button></div><div id="orderDateMenu" class="date-sheet" style="display:none"></div><div id="orderList"></div></section>
  <section id="page-order-detail" class="page"><div id="orderDetailBox"></div></section>
  <section id="page-report" class="page"><div class="report-head"><select id="reportRange" onchange="renderReport()"><option value="today">今天</option><option value="7">近7天</option><option value="30">近30天</option><option value="all">全部</option></select><span>全部店铺🔒</span><span>全部仓库🔒</span></div><div class="report-card"><div class="row"><div class="title" style="font-size:20px;margin:0">销售情况</div><button class="small-link" onclick="openBusinessAnalysis()">查看详情 ›</button></div><div class="metric-grid" id="salesMetrics"></div><div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px" class="grid3"><div>👕 商品分析🔒</div><div>👤 客户分析🔒</div><div>👥 其他分析🔒</div></div></div><div class="report-card"><div class="row"><div class="title" style="font-size:20px;margin:0">财务情况</div><span class="sub">查看详情 ›</span></div><div class="metric-grid" id="financeMetrics"></div></div><div class="report-card"><div class="row"><div class="title" style="font-size:20px;margin:0">出入库情况</div><span class="sub">查看详情 ›</span></div><div class="metric-grid" id="stockMetrics"></div></div><div class="report-card"><div class="row"><div class="title" style="font-size:20px;margin:0">商品分析</div><button class="small-link" onclick="openProductAnalysis()">查看详情 ›</button></div><div id="topProducts"></div></div></section>
  <section id="page-business" class="page"><div class="filterbar"><select><option>按天</option><option>按周</option><option>按月</option></select><button>近7天</button><button>近30天</button><button class="btn-blue btn-small" onclick="renderBusinessAnalysis()">今天</button></div><div class="analysis-cards" id="analysisCards"></div><div class="chart-card"><div class="row"><b>销售金额趋势</b><span class="sub">环比 --</span></div><svg id="salesChart" class="svg-chart" viewBox="0 0 360 220"></svg></div></section>
  <section id="page-product-analysis" class="page"><div class="filterbar"><select id="paRange" onchange="renderProductAnalysis()"><option value="today">按天</option><option value="7">近7天</option><option value="30">近30天</option><option value="all">全部</option></select><button>筛选 ▾</button><button onclick="showPage('report')">×</button></div><div class="product-analysis"><table><thead><tr><th>商品款号</th><th>销量</th><th>退货数</th><th>销售金额</th><th>销售均价</th><th>未发数</th><th>毛利</th><th>毛利率</th><th>库存</th><th>可用数</th></tr></thead><tbody id="productAnalysisRows"></tbody></table></div></section>
  <section id="page-me" class="page"><div class="card"><div class="title">商品资料</div><input id="prodCode" placeholder="货号，例如 26195"><input id="prodName" placeholder="商品名称，例如 美人鱼尾巴泳衣" style="margin-top:8px"><div class="grid2"><input id="prodCategory" placeholder="分类，例如 泳衣"><input id="prodPrice" type="number" placeholder="售价，例如 69"></div><div class="grid2"><input id="prodCost" type="number" placeholder="成本，例如 39"><input id="prodStock" type="number" placeholder="默认库存，例如 100"></div><input id="prodColors" placeholder="颜色，用逗号隔开，例如 紫色,粉色" style="margin-top:8px"><input id="prodSizes" placeholder="尺码，用-隔开，例如 100-110-120-130-140-150" style="margin-top:8px"><label>商品图片</label><div class="form-img-panel"><div id="prodImagePreview" class="img-preview">暂无图片</div><div><input id="prodImageFile" type="file" accept="image/*" onchange="handleProductFormImage(event)"><button class="btn-small btn-gray" onclick="clearProductFormImage()">删除图片</button></div></div><div class="grid2" style="margin-top:12px"><button class="btn btn-blue" onclick="saveProductForm()">保存商品</button><button class="btn btn-gray" onclick="resetProductForm()">清空</button></div></div><div class="card"><div class="row"><div class="title">商品列表</div><button class="btn-small btn-gray" onclick="exportData()">备份数据</button></div><div id="manageProductList"></div><label>恢复备份</label><input type="file" accept=".json" onchange="importData(event)"></div></section>
</div>
<div class="nav"><div class="nav-inner"><button class="nav-item active" id="nav-sale" onclick="showPage('sale')"><span class="ico">📝</span><span>开单</span></button><button class="nav-item" id="nav-orders" onclick="showPage('orders')"><span class="ico">📋</span><span>单据</span></button><button class="nav-item" id="nav-report" onclick="showPage('report')"><span class="ico">📈</span><span>报表</span></button><button class="nav-item" id="nav-me" onclick="showPage('me')"><span class="ico">👤</span><span>我的</span></button></div></div>

<script>
const STORAGE_KEY="bafang_sales_v1";
function $(id){return document.getElementById(id)}function uid(p){return p+"-"+Date.now()+"-"+Math.floor(Math.random()*10000)}function n(v){const x=Number(v);return Number.isFinite(x)?x:0}function money(v){return n(v).toFixed(2)}function esc(v){return String(v??"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]))}function today(){return new Date().toISOString().slice(0,10)}function nowText(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`}function fullDay(ts){return new Date(ts||Date.now()).toISOString().slice(0,10)}
function placeholderImg(code,name){const c=["#dbeafe","#fde2e2","#dcfce7","#fef3c7","#f3e8ff"][String(code).charCodeAt(0)%5];const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160"><rect width="100%" height="100%" fill="${c}"/><text x="50%" y="45%" text-anchor="middle" font-size="24" font-family="Arial" fill="#334155">${code}</text><text x="50%" y="63%" text-anchor="middle" font-size="14" font-family="Arial" fill="#64748b">${String(name||"商品").slice(0,6)}</text></svg>`;return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)}

function openOrderDetail(id){renderOrderDetail(id);showPage("order-detail")}function renderOrderDetail(id){const o=data.orders.find(x=>x.id===id);if(!o)return;const rows=o.items.map(x=>{const p=getProduct(x.code)||{};const sizes=(p.sizes||[x.size]).slice(0,6);return `<div class="cart-row"><img class="thumb sm" src="${esc(p.image||"")}" onclick="openImagePreview(event,this.src)"><div><div class="small-link">${esc(x.code)}${esc(x.name)}</div><div>${esc(x.category||"")}</div><div>${money(x.price)}</div></div><div style="text-align:right;font-size:20px;font-weight:900">${x.qty}<br><span class="sub">${money(x.qty*x.price)}</span></div></div><div style="display:grid;grid-template-columns:1fr repeat(${sizes.length},1fr);background:#fafafa;padding:8px 4px;text-align:center"><b>规格</b>${sizes.map(s=>`<span>${esc(s)}</span>`).join("")}<b>${esc(x.color)}</b>${sizes.map(s=>`<span>${s===x.size?x.qty:0}</span>`).join("")}</div>`}).join("");const isVoid=!!o.isVoid;const topStatus=isVoid?`<h2 class="void-line">已作废</h2>`:`<h2>未发 0 件</h2><h2>已结清</h2>`;$("orderDetailBox").innerHTML=`<div class="card" style="margin:0;border-radius:0"><div class="row">${topStatus}<span class="sub">查看明细 ›</span></div></div><div class="card"><div class="title">客户</div><div style="font-size:20px">${esc(o.customer)}</div></div><div class="card"><div class="title">订单信息</div><div class="info-list">${infoLine("订单号",o.id,"复制")}${infoLine("店铺","聚货通","")}${infoLine("订单标签",o.orderTag,"")}${infoLine("发货状态",o.shipStatus,"")}${infoLine("下单时间",o.created,"")}${infoLine("发货方式",`${o.shipMethod} ${o.pickupCode}`,"复制")}${infoLine("发货仓",o.warehouse,"")}${infoLine("订单数量",`${o.totalQty}件(${o.items.length}款,${o.items.length}种SKU)`,"")}${infoLine("应收金额","￥ "+money(isVoid?0:o.receivable),"")}${infoLine("原单金额","￥ "+money(isVoid?(o.voidAmount||o.amount):o.amount),"")}${infoLine("运费","￥ 0.00","")}${infoLine("抹零金额","￥ "+money(o.roundOff),"")}${infoLine("业务员",o.salesman,"")}${infoLine("备注",o.note||"请输入","")}${isVoid?infoLine("作废时间",o.voidedAt||"",""):""}<div class="info-line"><div class="k">附件</div><div>${o.attachment?`<img src="${esc(o.attachment)}" class="thumb sm" onclick="openImagePreview(event,this.src)">`:`<div class="img-preview" style="width:76px;height:76px">＋</div>`}</div><div></div></div></div></div><div class="card"><div class="title">商品信息</div>${rows}</div><div class="bottom-bar"><div class="bottom-inner detail-actions-4"><button class="btn-small btn-red" onclick="voidOrder('${esc(o.id)}')" ${isVoid?"disabled":""}>作废</button><button class="btn-small btn-light" onclick="startEditOrder('${esc(o.id)}')" ${isVoid?"disabled":""}>修改</button><button class="btn btn-light" ${isVoid?"disabled":""}>收款</button><button class="btn btn-blue" ${isVoid?"disabled":""}>直接发货</button></div></div>`}
function infoLine(k,v,btn){return `<div class="info-line"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div>${btn?`<button class="btn-small btn-gray" onclick="copyText('${esc(v)}')">${btn}</button>`:""}</div></div>`}function copyText(t){navigator.clipboard&&navigator.clipboard.writeText(t);alert("已复制")}
function ordersInRange(range){const base=data.orders.filter(o=>!o.isVoid);if(range==="all")return base;let cutoff=range==="today"?new Date(today()+"T00:00:00").getTime():Date.now()-n(range)*86400000;return base.filter(o=>n(o.createdTs)>=cutoff)}function calcSummary(range){const os=ordersInRange(range),qty=os.reduce((s,o)=>s+n(o.totalQty),0),amount=os.reduce((s,o)=>s+n(o.receivable),0),cost=os.reduce((s,o)=>s+o.items.reduce((a,i)=>a+n(i.qty)*n(i.cost),0),0),profit=amount-cost,margin=amount?profit/amount*100:0;return {os,qty,amount,cost,profit,margin}}
function metricHtml(label,value,sub="环比 --"){return `<div class="metric"><div class="label">${label}</div><div class="value">${value}</div><div class="trend">${sub}</div></div>`}function renderReport(){const range=$("reportRange")?$("reportRange").value:"today",s=calcSummary(range);$("salesMetrics").innerHTML=metricHtml(`销售 ${s.qty}件`,money(s.amount),"环比 --")+metricHtml("退货 0件","0.00","环比 --")+metricHtml("毛利率",s.margin.toFixed(2)+"%","毛利 "+money(s.profit));$("financeMetrics").innerHTML=metricHtml("总收入 "+s.os.length+"笔",money(s.amount))+metricHtml("总支出 0笔","0.00")+metricHtml("净收入",money(s.amount));$("stockMetrics").innerHTML=metricHtml("出库数",s.qty)+metricHtml("出库金额",money(s.amount))+metricHtml("出库毛利",money(s.profit))+metricHtml("采购入库数","0")+metricHtml("采购入库金额","0.00");renderTopProducts(range)}
function productStats(range){const stats={};ordersInRange(range).forEach(o=>o.items.forEach(i=>{if(!stats[i.code])stats[i.code]={code:i.code,qty:0,amount:0,cost:0,returns:0,unship:0};stats[i.code].qty+=n(i.qty);stats[i.code].amount+=n(i.qty)*n(i.price);stats[i.code].cost+=n(i.qty)*n(i.cost)}));return Object.values(stats).map(x=>{x.profit=x.amount-x.cost;x.margin=x.amount?x.profit/x.amount*100:0;x.avg=x.qty?x.amount/x.qty:0;x.stock=totalStock(getProduct(x.code)||{});return x}).sort((a,b)=>b.amount-a.amount)}
function renderTopProducts(range){const rows=productStats(range).slice(0,4);$("topProducts").innerHTML=rows.map(s=>{const p=getProduct(s.code)||{};return `<div class="cart-row"><img class="thumb sm" src="${esc(p.image||"")}"><div><b>${esc(s.code)} ${esc(p.name||"")}</b><div class="sub">销量 ${s.qty}　毛利率 ${s.margin.toFixed(1)}%</div></div><b>${money(s.amount)}</b></div>`}).join("")||`<div class="empty">暂无销售数据</div>`}
function openBusinessAnalysis(){renderBusinessAnalysis();showPage("business")}function renderBusinessAnalysis(){const s=calcSummary("7");$("analysisCards").innerHTML=`<div class="analysis-card active"><div class="num">${money(s.amount)}</div><div class="txt">销售金额</div><div class="num">${s.qty}</div><div class="txt">销售数</div></div><div class="analysis-card"><div class="num">0.00</div><div class="txt">退货金额</div><div class="num">0</div><div class="txt">退货数</div></div><div class="analysis-card"><div class="num">${money(s.profit)}</div><div class="txt">毛利</div><div class="num">${s.os.length}</div><div class="txt">订单数</div></div>`;renderSalesChart()}
function renderSalesChart(){const days=[];for(let i=6;i>=0;i--){days.push(new Date(Date.now()-i*86400000).toISOString().slice(0,10))}const vals=days.map(day=>data.orders.filter(o=>fullDay(o.createdTs)===day).reduce((s,o)=>s+n(o.receivable),0)),max=Math.max(100,...vals),pts=vals.map((v,i)=>[28+i*50,190-(v/max)*150]),poly=pts.map(p=>p.join(",")).join(" ");$("salesChart").innerHTML=`<line x1="24" y1="190" x2="340" y2="190" stroke="#e5e7eb"/><line x1="24" y1="40" x2="340" y2="40" stroke="#e5e7eb"/><polyline points="${poly}" fill="none" stroke="#4f7df3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#4f7df3"/><text x="${p[0]-10}" y="210" font-size="11" fill="#6b7280">${days[i].slice(5)}</text>`).join("")}`}
function openProductAnalysis(){renderProductAnalysis();showPage("product-analysis")}function renderProductAnalysis(){const range=$("paRange")?$("paRange").value:"today",stats=productStats(range);$("productAnalysisRows").innerHTML=stats.map(s=>{const p=getProduct(s.code)||{};return `<tr><td><div class="pa-product"><img src="${esc(p.image||"")}"><span>${esc(s.code)}${esc(p.name||"")}</span></div></td><td>${s.qty}</td><td>${s.returns}</td><td>${money(s.amount)}</td><td>${money(s.avg)}</td><td>${s.unship}</td><td>${money(s.profit)}</td><td>${s.margin.toFixed(2)}%</td><td>${s.stock}</td><td>${s.stock}</td></tr>`}).join("")||`<tr><td colspan="10">暂无销售数据</td></tr>`}
function salesQtyByCode(code){return data.orders.reduce((s,o)=>s+o.items.filter(i=>i.code===code).reduce((a,i)=>a+n(i.qty),0),0)}function renderManageProducts(){$("manageProductList").innerHTML=data.products.map(p=>`<div class="product-manage-row"><img src="${esc(p.image||"")}" onclick="openImagePreview(event,this.src)"><div><b>${esc(p.code)} ${esc(p.name)}</b><div class="stock-mini">售价 ${money(p.price)}　成本 ${money(p.cost)}　库存 ${totalStock(p)}</div></div><div><button class="btn-small btn-gray" onclick="editProduct('${esc(p.code)}')">改</button><button class="btn-small btn-red" onclick="deleteProduct('${esc(p.code)}')">删</button></div></div>`).join("")||`<div class="empty">暂无商品</div>`;renderProductFormImage()}
function parseList(v,sep){return String(v||"").split(sep).map(x=>x.trim()).filter(Boolean)}function saveProductForm(){const code=$("prodCode").value.trim(),name=$("prodName").value.trim(),category=$("prodCategory").value.trim()||"商品";if(!code||!name)return alert("请填写货号和名称");const colors=parseList($("prodColors").value.replace(/，/g,","),","),sizes=parseList($("prodSizes").value.replace(/、/g,"-").replace(/，/g,"-"),"-");if(!colors.length||!sizes.length)return alert("请填写颜色和尺码");let p=getProduct(editingProductCode||code);const defStock=n($("prodStock").value);if(!p){p={id:uid("P"),code,name,category,price:n($("prodPrice").value),cost:n($("prodCost").value),colors,sizes,stock:{},image:tempProductImage||placeholderImg(code,name),created:Date.now()};data.products.push(p)}p.code=code;p.name=name;p.category=category;p.price=n($("prodPrice").value);p.cost=n($("prodCost").value);p.colors=colors;p.sizes=sizes;p.image=tempProductImage||p.image||placeholderImg(code,name);colors.forEach(c=>sizes.forEach(s=>{if(stockOf(p,c,s)===0&&defStock>0)setStock(p,c,s,defStock);else setStock(p,c,s,stockOf(p,c,s))}));save();resetProductForm();renderManageProducts();renderSaleProducts();alert("商品已保存")}
function editProduct(code){const p=getProduct(code);if(!p)return;editingProductCode=code;$("prodCode").value=p.code;$("prodName").value=p.name;$("prodCategory").value=p.category;$("prodPrice").value=p.price;$("prodCost").value=p.cost;$("prodColors").value=(p.colors||[]).join(",");$("prodSizes").value=(p.sizes||[]).join("-");$("prodStock").value="";tempProductImage=p.image||"";renderProductFormImage();window.scrollTo(0,0)}
function deleteProduct(code){if(data.orders.some(o=>o.items.some(i=>i.code===code)))return alert("已有销售单使用该商品，不能直接删除");if(!confirm("确定删除商品？"))return;data.products=data.products.filter(p=>p.code!==code);save();renderManageProducts();renderSaleProducts()}function resetProductForm(){editingProductCode="";["prodCode","prodName","prodCategory","prodPrice","prodCost","prodColors","prodSizes","prodStock"].forEach(id=>$(id).value="");tempProductImage="";renderProductFormImage()}function renderProductFormImage(){$("prodImagePreview").innerHTML=tempProductImage?`<img src="${esc(tempProductImage)}">`:"暂无图片";if($("prodImageFile"))$("prodImageFile").value=""}function clearProductFormImage(){tempProductImage="";renderProductFormImage()}
function readFileAsDataURL(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result||""));fr.onerror=rej;fr.readAsDataURL(file)})}function compressImageDataUrl(dataUrl,maxSide=720,quality=.82){return new Promise(resolve=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,maxSide/Math.max(img.width||1,img.height||1)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext("2d");ctx.drawImage(img,0,0,c.width,c.height);try{resolve(c.toDataURL("image/jpeg",quality))}catch(e){resolve(dataUrl)}};img.onerror=()=>resolve(dataUrl);img.src=dataUrl})}async function handleProductFormImage(e){const file=e.target.files&&e.target.files[0];if(!file)return;const raw=await readFileAsDataURL(file);tempProductImage=await compressImageDataUrl(raw);renderProductFormImage()}
function renderOrderAttach(){$("orderAttachPreview").innerHTML=tempOrderAttach?`<img src="${esc(tempOrderAttach)}">`:"无附件";if($("orderAttachFile"))$("orderAttachFile").value=""}function clearOrderAttach(){tempOrderAttach="";renderOrderAttach()}async function handleOrderAttach(e){const file=e.target.files&&e.target.files[0];if(!file)return;const raw=await readFileAsDataURL(file);tempOrderAttach=await compressImageDataUrl(raw,1000,.82);renderOrderAttach()}
function openImagePreview(e,src){if(e){e.stopPropagation();e.preventDefault()}if(!src)return;$("imageModalImg").src=src;$("imageModal").classList.add("show")}function closeImagePreview(){$("imageModal").classList.remove("show");$("imageModalImg").src=""}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="八方来财销售开单版备份.json";a.click()}function importData(e){const f=e.target.files&&e.target.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d.products||!d.orders)return alert("备份文件不正确");data=d;save();renderAll();alert("恢复成功")}catch(err){alert("恢复失败")}};fr.readAsText(f)}
function renderAll(){renderSaleProducts();renderCart();renderOrders();renderReport();renderManageProducts()}renderAll();
</script>
